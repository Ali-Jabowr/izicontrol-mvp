[project]
name = "callscope"
version = "0.1.0"
description = "MVP: структурированный разбор клиентских звонков с контролем галлюцинаций"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["callscope"]
