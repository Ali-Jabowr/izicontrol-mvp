# Эталон, размеченный вручную по транскриптам.
#
# Проверяются не формулировки (они у LLM каждый раз разные), а ФАКТЫ:
# правильно ли посчитаны даты, не попало ли отклонённое предложение
# в согласованные шаги, замечены ли ключевые риски и ошибки менеджера.
#
# Группа ключевых слов = список альтернатив: достаточно, чтобы совпала любая.

01_alfa_metall.md:
  outcome: продвижение
  next_action_date: "2026-09-10"          # «в этот четверг» → 10 сентября
  next_action_time: "15:00"
  timezone_contains: "екатеринбург"        # 15:00 ЕКБ ≠ 15:00 МСК, терять нельзя
  dates_present:
    - "2026-09-09"                         # «пришлите до среды список вопросов»
    - "2026-09-10"                         # техническая встреча
  no_date_before_call: true
  grounding_min: 0.85
  mistakes_cover:
    - ["коммерческ", "кп"]                 # полезла с КП, когда клиент просил схему
    - ["безопасн", "хранени"]              # клиенту пришлось напомнить самому
  risks_cover:
    - ["упп", "доработ", "коннектор"]
    - ["облак", "безопасност", "сб"]
  needs_cover:
    - ["эффект", "экономи", "лиценз"]      # нужен эффект, а не прайс
    - ["ручн", "переноc", "перенос", "интеграц"]
  attention_cover:
    - ["безопасн", "хранени", "схем"]
  decision_makers_cover:
    - ["сергей"]
    - ["генеральн"]

02_zelenaya_polka.md:
  outcome: продвижение
  dates_present:
    - "2026-09-09"                         # «завтра до конца дня» — список данных
    - "2026-09-14"                         # «к понедельнику» — расчёт и план запуска
  no_date_before_call: true
  grounding_min: 0.85
  not_in_agreed_steps:
    - ["недоступна", "после четыр"]        # это ограничение, а не действие
  mistakes_cover:
    - ["около", "точн", "приблизит"]       # «около 180 тысяч» клиент отверг
    - ["качественнее", "конкурент", "аргумент"]
    - ["стандартн", "типов"]               # стандартное КП после прямого «не приму»
  risks_cover:
    - ["120", "конкурент"]
    - ["160", "бюджет"]
    - ["ноябр", "01.11", "1 ноября"]       # жёсткий внешний дедлайн
  needs_cover:
    - ["обучени", "продавц", "персонал"]
    - ["план", "запуск", "аудит", "тест"]
  attention_cover:
    - ["бюджет", "цен", "160", "180"]
  constraints_cover:
    - ["магазин", "не звон"]               # прямой запрет звонить без неё

03_stroykomplekt.md:
  outcome: продвижение
  next_action_date: "2026-09-11"           # «в пятницу»
  next_action_time: "11:30"                # клиент ИСПРАВИЛ 11:00 → 11:30
  no_date_before_call: true
  grounding_min: 0.85
  not_in_agreed_steps:
    - ["записи завтра", "завтра записи", "завтра передаст"]  # предложение отклонено
  mistakes_cover:
    - ["битрикс", "замен"]                 # предложил заменить то, что внедряли 2 года
    - ["доступ", "nda", "нда"]             # запросил доступ до NDA
  risks_cover:
    - ["зарубеж", "облак", "российск", "контур"]   # «проект сразу стоп»
    - ["nda", "нда", "юрист"]
  needs_cover:
    - ["без миграц", "без замен", "не замен", "битрикс"]
    - ["сводк", "пять разговор", "вмешат"]  # утренний дайджест — суть продукта
  attention_cover:
    - ["контур", "зарубеж", "персональн", "данн"]

